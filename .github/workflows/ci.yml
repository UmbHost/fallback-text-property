name: CI

on:
  push:
    branches: [ dev/v17 ]
  pull_request:
    branches: [ dev/v17 ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: dotnet restore UmbHost.FallbackTextProperty.sln
      - run: dotnet build UmbHost.FallbackTextProperty.sln -c Release --no-restore
      - run: dotnet test UmbHost.FallbackTextProperty.sln -c Release --no-build
      - run: dotnet pack UmbHost.FallbackTextProperty/UmbHost.FallbackTextProperty.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
